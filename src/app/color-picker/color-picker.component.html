<div>
	<label class="d-block" [attr.for]="control?.key">{{ control?.label || 'Pick color' }}</label>
	<input
		type="color"
		class="form-control"
		[id]="control?.key"
		[value]="value"
		[disabled]="disabled || control?.isDisabled"
		(input)="onColorInput($event)"
		(blur)="onBlur()" />
	<small class="text-muted">{{ value }}</small>
</div>
