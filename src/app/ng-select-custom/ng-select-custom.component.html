<div>
    <label class="d-block" [attr.for]="control?.key">{{ control?.label || 'Select option' }}</label>
    <select
        class="form-control"
        [id]="control?.key"
        [disabled]="disabled || control?.isDisabled"
        [value]="selectedValue"
        (change)="onSelectionEvent($event)"
        (blur)="onBlur()">
        <option value="">Select value</option>
        <option *ngFor="let age of ages" [value]="age.value">{{ age.label }}</option>
    </select>
</div>
