
<div class="gcb-control gcb-range-date mb-2">
  <label *ngIf="control?.label" class="form-label">
    {{ control?.label }}
    <span *ngIf="control?.required" class="text-danger">*</span>
  </label>

  <div class="row g-2 align-items-center">
    <div class="col">
      <input class="form-control"
             type="date"
             [value]="startDateValue"
             [disabled]="disabled || control?.isDisabled"
             (change)="onStartDateChange($any($event.target).value)" />
    </div>
    <div class="col-auto text-muted">to</div>
    <div class="col">
      <input class="form-control"
             type="date"
             [value]="endDateValue"
             [disabled]="disabled || control?.isDisabled"
             (change)="onEndDateChange($any($event.target).value)" />
    </div>
    <div class="col-auto">
      <button class="btn btn-outline-secondary" type="button" (click)="clearSelection()">Clear</button>
    </div>
  </div>

  <small class="form-text text-muted" *ngIf="displayValue">{{ displayValue }}</small>
</div>
