<ion-item class="gci-control gci-text-area" lines="full">
  <ion-label position="stacked" *ngIf="control?.label">
    {{ control?.label }}<span *ngIf="control?.required" class="gci-required">&nbsp;*</span>
  </ion-label>
  <ion-textarea
    [attr.id]="control?.key"
    [rows]="rows"
    [disabled]="disabled || control?.isDisabled"
    [value]="value || ''"
    (ionInput)="onInput($event.detail.value)"
    (ionBlur)="onBlur()">
  </ion-textarea>
</ion-item>
