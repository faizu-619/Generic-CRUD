<ion-item class="gci-control gci-single-date" lines="full">
  <ion-label position="stacked" *ngIf="control?.label">
    {{ control?.label }}<span *ngIf="control?.required" class="gci-required">&nbsp;*</span>
  </ion-label>
  <ion-input
    [id]="triggerId"
    [readonly]="true"
    [disabled]="disabled || control?.isDisabled"
    [value]="value || ''"
    (ionBlur)="onBlur()">
  </ion-input>
</ion-item>

<ion-popover [trigger]="triggerId" [showBackdrop]="false" [dismissOnSelect]="true">
  <ng-template>
    <ion-datetime
      presentation="date"
      [value]="value || null"
      (ionChange)="onDateChange($event.detail.value)">
    </ion-datetime>
  </ng-template>
</ion-popover>
