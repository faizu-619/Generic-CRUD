<input *ngIf="!control.format"
       [value]="control.type === 'hidden' ? '' : (value || '')"
       (input)="onInputChange($event)"
       (blur)="onBlur()"
       [disabled]="disabled || control.isDisabled"
       [type]="control.type"
       class="form-control"
       autocomplete="off">
